# 未覆盖的参数继承 config.yaml；每组独立输出，顺序运行。
experiments:
  - name: rotation36_exp_sum
    enabled: true
    overrides:
      rotation_mode: search
      rot_retrieval_mode: rot_weighting_argmax
      heading_temperature: 0.02
  - name: rotation36_cosine_sum
    enabled: true
    overrides:
      rotation_mode: search
      rot_retrieval_mode: rot_sum_argmax
  - name: rotation36_joint_topk
    enabled: true
    overrides:
      rotation_mode: search
      rot_retrieval_mode: rot_xy_argmax
  - name: rotation36_xy_max
    enabled: true
    overrides:
      rotation_mode: search
      rot_retrieval_mode: rot_argmax
