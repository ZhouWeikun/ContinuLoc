# Wingtra：Zurich + Zuchwil；各实验独立训练，共享同一批量列表。
# generated 保留 aff2d_corrected 质量过滤，忽略历史 split 列及其空行。
# 划分对照：segment 80%/5%/15% 或 interval 90%/0%/10%；均为 50 epochs。
  - name: stage1_wingtraS2_segmentT80V5_softtripletAlpha10_4dof
    base_yaml: configs/stage1_visual_encoder_wingtra.yaml
    enabled: true
    overrides:
      split_source: generated
      split_mode: segment
      split_train_ratio: 0.8
      split_val_ratio: 0.05
      pair_alignment_mode: full_4d
      n_global_negatives_per_batch: 384
      reject_sampling: false
      loss_type: triplet_single_edge
      triplet_gate: softplus
      triplet_enable_row_filter: false
      triplet_learnable_alpha: false
      triplet_alpha: 10.0
      num_epochs: 50
      load2test: ''
      dir2save_log: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/logs
      dir2save_ckpt: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/ckpts

