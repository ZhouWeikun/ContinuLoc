      # 数据划分：generated 按当前比例生成划分，忽略 CSV 中历史 split 列。
      split_source: generated
      split_mode: segment # segment / interval / random
      split_train_ratio: 0.8
      split_val_ratio: 0.05 # 测试集比例 = 1 - train - val，此处为 0.15
      # 正样本配对：full_4d 为位置、方向、尺度对齐；xy_only 为二维位置对照。
      pair_alignment_mode: xy_only # full_4d / xy_only
      n_global_negatives_per_batch: 384
      reject_sampling: false
      # loss:
      loss_type: triplet_single_edge
      triplet_gate: softplus
      triplet_enable_row_filter: false
      triplet_learnable_alpha: false
      triplet_alpha: 20.0

