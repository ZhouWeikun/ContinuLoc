      output_root: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/res_ckpts_stage1
      export_retrieval: true # 保存 Top-K 检索 bundle，供 refine_after_retrieval 使用。
      scenes: [] # 使用 checkpoint 中的全部场景。

      #xy
