# Zurich 历史权重复测：INGP 粗搜索确定尺度，INGP 完成后续搜索。
# Z04 的 epoch899 权重已不在本地，使用现存的 epoch999；Z09 使用最佳 epoch960。
experiments:
  - name: stage3_Z04_zurich_interval_ep999_ingpGlobalPoseMaxT002_noFilter
    enabled: true
    overrides:
      selected_scene_name: zurich
      load_stage2_ckpt: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/ckpts/stage2_wingtra_intervalT90V0_softtripletAlpha10_zurich/epoch999.pth
      inherit_stage2_yaml: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/ckpts/stage2_wingtra_intervalT90V0_softtripletAlpha10_zurich/opts.yaml
      scale_filter_mode: none
      stage3_recall_cfg: per_scene
      hds_stage1_gallery_feature_source: ingp
      hds_stage1_visual_gallery_batch_size: 128
      hds_stage1_visual_score_mode: cosine_softmax
      hds_stage1_visual_softmax_temperature: 0.02
      hds_stage1_n_scale: 4
      hds_stage1_scale_spacing: log
      hds_scale_select_mode: log_expectation
      hds_scale_select_scope: global_pose_max
      hds_stage2_particles_m: 8
      hds_stage2_enable_scale_sampling: false
      hds_stage3_optimize_scale: false
      hds_eval_n_samples: null

  - name: stage3_Z09_zurich_interval_ep960_ingpGlobalPoseMaxT002_madFilter
    enabled: true
    overrides:
      selected_scene_name: zurich
      load_stage2_ckpt: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/ckpts/stage2_zurich_interval91_wRejectSampling_tripleLoss_singleEdge_hardest_fmMask_dinov2_adF4_codebookW18_mlpH1024B2_PN1cubie/epoch960_R1=83_MidErr=25m.pth
      inherit_stage2_yaml: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/ckpts/stage2_zurich_interval91_wRejectSampling_tripleLoss_singleEdge_hardest_fmMask_dinov2_adF4_codebookW18_mlpH1024B2_PN1cubie/opts.yaml
      scale_filter_mode: mad
      stage3_recall_cfg: per_scene
      hds_stage1_gallery_feature_source: ingp
      hds_stage1_visual_gallery_batch_size: 128
      hds_stage1_visual_score_mode: cosine_softmax
      hds_stage1_visual_softmax_temperature: 0.02
      hds_stage1_n_scale: 4
      hds_stage1_scale_spacing: log
      hds_scale_select_mode: log_expectation
