# 相对路径均以仓库根目录为基准。
retrieval_dir: null # 已完成的 eval_stage1 结果目录，或它下面的 retrieval/。
split: test # test | val | all；all 分别统计两个划分，不混合。
scenes: [] # [] 处理全部场景；也可填写 [visloc_01, visloc_02] 或 ["01", "02"]（简写须加引号）。。
matcher_model: gim_dkm
weights_dir: null # null 使用 GIM 默认权重目录。
topn_match: 5
min_inliers_for_refine: 8
limit_queries: null # null 处理全部 query；填 2 可先做少量验证。
save_intermediates: false
output_root: gen_fm_exps/refine_after_retrieval
