# 启动：conda run --no-capture-output -n gim python experiments/refine_after_retrieval/run_batch.py
# 预览：在上面命令末尾加 --dry-run，不加载 GIM、不执行匹配。
# 每组独立继承 config.yaml；enabled: false 跳过，失败则停止后续任务。
experiments:
  - name: rotWeightingN36_ep24_dkm_top5
    enabled: false
    overrides:
      retrieval_dir: gen_fm_exps/res_stage1_retrieval/stage1_vislocS9_segmentT80V5_softtripletAlpha10_4dof_epoch024_stage1_vislocS9_segmentT8V05_softtripletAlpha10_4dof_rotWeightingN36_ep24_20261017T123634842385Z
      split: test
      scenes: ["visloc_01"]
      matcher_model: gim_dkm
      topn_match: 5
      min_inliers_for_refine: 8
      limit_queries: null
      save_intermediates: false
      output_root: gen_fm_exps/refine_after_retrieval

  # checkpoint: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/ckpts/stage1_wingtraS2_segmentT80V5_softtripletAlpha20_4dof/epoch023_zurichR1=87_zuchwilR1=83.pth
  # 先在 eval_stage1 中使用以上 checkpoint，并设置 export_retrieval: true。
  # 将实际输出目录填入 retrieval_dir，再将 enabled 改为 true；refine 不直接加载 checkpoint。
  # opts.yaml: Zurich + Zuchwil，generated/segment，train=80%、val=5%、test=15%。
  - name: wingtraS2_segmentT80V5_softtripletAlpha20_4dof_ep23_dkm_top5
    enabled: true
    overrides:
      retrieval_dir: gen_fm_exps/res_stage1_retrieval/stage1_wingtraS2_segmentT80V5_softtripletAlpha20_4dof_epoch023_zurichR1=87_zuchwilR1=83_stage1_wingtraS2_segmentT80V5_softtripletAlpha20_4dof_rotWeightingN36_ep23_20261018T060540960512Z
      split: test
      scenes: ["zurich", "zuchwil"]
      matcher_model: gim_dkm
      topn_match: 5
      min_inliers_for_refine: 8
      limit_queries: null
      save_intermediates: false
      output_root: gen_fm_exps/refine_after_retrieval
