# Fill load_stage1_ckpt (.pth) and inherit_stage1_yaml (opts.yaml), or pass them on the command line.
exp_setting:
  dir2save_log: gen_fm_exps/logs
  dir2save_ckpt: gen_fm_exps/ckpts
  exp_name: stage2_wingtra
  save_freq: 100
  tensorboard: true
  val: true
  val_freq: 10
  load_stage1_ckpt: ''
  inherit_stage1_yaml: ''
  inherit_stage1_scope: network,data
  load2train: ''
  load2test: ''
scenes_setting:
  sampling_strategy: weighted
  dataset_name: wingtra
  selected_scene_name: zurich
  scene_registry:
    zurich:
      name: zurich
      p_satinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zurich/zurich_blocks12_proj2056_res03m.json
      p_uavinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zurich/uavimgs_info/uavimgs_metainfo.json
      p_uav_geocsv: /home/data/zwk/data_uavimgs_wingtra/Zurich/uavimgs_info/uavimgs_geo_corrected_gim_dkm_v1.csv
      weight: 1.0
    zuchwil:
      name: zuchwil
      p_satinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zuchwil/zuchwil_blocks12_proj2056_res03m.json
      p_uavinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zuchwil/uavimgs_info/uavimgs_metainfo.json
      p_uav_geocsv: /home/data/zwk/data_uavimgs_wingtra/Zuchwil/uavimgs_info/uavimgs_geo_corrected_gim_dkm_v1.csv
      weight: 1.0
data_setting:
  # Stage 2 sat尺度默认复现历史行为：按有效UAV尺度经验分布采样，再加完整跨度±5%的扰动。
  # 可选采样方式: empirical / uniform_linear / uniform_log。
  sat_scale_sampling_mode: empirical
  sat_scale_jitter_enabled: true
  sat_scale_jitter_half_span_ratio: 0.05
hardware_setting:
  autocast: false
  batchsize_sat: 512
  batchsize_uav: 64
  batchsize_uav_test: 128
  gpu_ids: '0'
  num_worker: 0
  satmaps_on_cpu: true
learning_setting:
  num_epochs: 1000
network_setting:
  p_grid_config_yaml: configs/nerf_hash_wingtra.yaml
  posenc_multires_rc: 8
  posenc_multires_rot: 6
  posenc_multires_scale: 4
  grid_mlp_hidden_dim: 1024
  grid_mlp_num_blocks: 2
  grid_mlp_use_coord_condition: true
