exp_setting:
  dir2save_log: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/logs  # 绝对路径
  dir2save_ckpt: /home/data/zwk/pyproj_neuloc_v0/gen_fm_exps/ckpts  # 绝对路径
  exp_name: stage1_wingtra_debug
  save_freq: 1
  tensorboard: True
  val: True
  val_freq: 1

  # load2test: 继续训练或测试时加载的checkpoint（字符串路径）
  load2test: "/home/data/zwk/pyproj_neuloc_v0/train_img_encoder/exps/multiscene_12km2_cl_salad_ep100/epoch095.pth"

  # load2train: 继续训练时加载的checkpoint（字符串路径）
  load2train: ""

# ==================== 数据加载配置 ====================
data_setting:
  # none: 仅质量筛选；percentile: P2 < h_cover_m < P99，参考尺度200m；
  # mad: modified-z <= 3.5，复现 master 中 zurich/zuchwil 实际走的分支。
  # 先过滤再生成 train/val/test 划分；旧 checkpoint 需使用其原始过滤配置。
  scale_filter_mode: mad #percentile|mad|null
  pad_mode: "zeros" #"zeros" or
  imgsize2net: 224
  satimgsize2crop: 244   #satimgsize2crop：res02m:zuchwil=540,zurich=614; res03m:zuchwil=400; res05m:zurich=224
  n_global_negatives_per_batch: 384 # 每个 batch 独立生成的全局负样本总数；0 为关闭
  reject_sampling: True
  pair_alignment_mode: full_4d #full_4d / xy_only
  n_rand2sample_per_pos: 256 #16
  sat_as_query: False #sat_as_query数量=batchsize_uav
  split_source: generated # 忽略历史 split 列，按当前比例划分
  split_train_ratio: 0.9
  split_val_ratio: 0.0 # 全部有效样本中的比例；test = 1 - train - val
  split_mode: interval

# ==================== 场景配置 ====================
# 场景列表（支持任意数量）：
# - 当列表只有1个场景时，程序自动使用单场景模式
# - 当列表有多个场景时，程序自动使用多场景模式
# 采样策略（仅在多场景时生效）：
# - "round_robin": 循环轮流采样各场景
# - "random": 随机选择场景
# - "weighted": 根据场景权重加权采样
scenes_setting:
  sampling_strategy: "weighted"
  # 场景列表（变长）
  dataset_name: wingtra
  scenes:
    - name: "zurich"
      p_satinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zurich/zurich_blocks12_proj2056_res03m.json
      p_uavinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zurich/uavimgs_info/uavimgs_metainfo.json
      p_uav_geocsv: /home/data/zwk/data_uavimgs_wingtra/Zurich/uavimgs_info/uavimgs_geo_corrected_gim_dkm_v1.csv
    - name: "zuchwil"
      p_satinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zuchwil/zuchwil_blocks12_proj2056_res03m.json
      p_uavinfo_json: /home/data/zwk/data_uavimgs_wingtra/Zuchwil/uavimgs_info/uavimgs_metainfo.json
      p_uav_geocsv: /home/data/zwk/data_uavimgs_wingtra/Zuchwil/uavimgs_info/uavimgs_geo_corrected_gim_dkm_v1.csv
    # 添加更多场景（如果需要），只需继续添加列表项即可
hardware_setting:
#  batchsize_uav: 64
  batchsize_uav: 32
  sat_as_query: False #sat_as_query数量=batchsize_uav
  autocast: True
  gpu_ids: '0'
  num_worker: 8

learning_setting:
  loss_type: triplet_single_edge # triplet_single_edge / infonce
  triplet_alpha: 5.0
  triplet_margin: 0.0
  triplet_gate: softplus # softplus / hard
  triplet_enable_row_filter: false
  triplet_learnable_alpha: false
  triplet_metric: dist # dist / similarity
  triplet_reduction: mean # mean / sum
  infonce_temperature: 0.1
  infonce_learnable_temperature: false
  infonce_gate: soft # soft / hard
  infonce_negative_mode: batch_and_explicit
  infonce_metric: similarity
  infonce_normalize: true
  num_epochs: 25
  #when evaluating
  val_overlap: 0.5
  val_query_rot2uniform: True
  val_query_scale2uniform: False


network_setting:
  backbone: dinov2
  freeze_backbone: True
  backbone_config:
    num_trainable_blocks: 2

  aggregator_type: salad
  aggregator_config:
    output_dim: 1024
    cluster_dim: 64
    hidden_layer_dim: 512
    use_residual: True
    with_dustbin: True

  adapter_config:
    enabled: True
    normalize_before_aggregator: False
    n_last_blocks_with_adapter: 4 #dinov2_vitb14 一共 12 个 blocks
    bottleneck_dim: 64
    attn_adapter: False
    ffn_parallel_adapter: True
    scale: 0.2
    dropout: 0.0
    init: zero_up
